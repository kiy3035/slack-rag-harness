services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_harness}
      POSTGRES_USER: ${POSTGRES_USER:-rag_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rag_harness}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
    environment: &app-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_harness}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-rag_harness}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rag_harness}:${RABBITMQ_PASSWORD:-local_dev_password}@rabbitmq:5672/
      RABBITMQ_JOB_EXCHANGE: ${RABBITMQ_JOB_EXCHANGE:-rag_harness.jobs}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-rag_harness.jobs.retry}
      RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE:-rag_harness.jobs.dlx}
      RABBITMQ_JOB_QUEUE: ${RABBITMQ_JOB_QUEUE:-rag_harness.jobs}
      RABBITMQ_RETRY_QUEUE: ${RABBITMQ_RETRY_QUEUE:-rag_harness.jobs.retry}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-rag_harness.jobs.dlq}
      RABBITMQ_JOB_ROUTING_KEY: ${RABBITMQ_JOB_ROUTING_KEY:-job.execute}
      RABBITMQ_RETRY_ROUTING_KEY: ${RABBITMQ_RETRY_ROUTING_KEY:-job.retry}
      RABBITMQ_DEAD_LETTER_ROUTING_KEY: ${RABBITMQ_DEAD_LETTER_ROUTING_KEY:-job.dead}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-0.5}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-1}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-60}
      ENABLE_LOCAL_EVENTS: ${ENABLE_LOCAL_EVENTS:-true}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-local_test_signing_secret}
      SLACK_TIMESTAMP_TOLERANCE_SECONDS: ${SLACK_TIMESTAMP_TOLERANCE_SECONDS:-300}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
    environment:
      <<: *app-environment
    command: ["sh", "-c", "alembic upgrade head && python -m app.outbox.main"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  test:
    build:
      context: .
    environment:
      <<: *app-environment
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_harness}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-rag_harness}
      TEST_RABBITMQ_URL: amqp://${RABBITMQ_USER:-rag_harness}:${RABBITMQ_PASSWORD:-local_dev_password}@rabbitmq:5672/
    command: ["sh", "-c", "alembic upgrade head && pytest -q"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres-data:
