services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_harness}
      POSTGRES_USER: ${POSTGRES_USER:-rag_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rag_harness}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "127.0.0.1:${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: unless-stopped

  api:
    build:
      context: .
    environment: &app-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_harness}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-rag_harness}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rag_harness}:${RABBITMQ_PASSWORD:-local_dev_password}@rabbitmq:5672/
      RABBITMQ_JOB_EXCHANGE: ${RABBITMQ_JOB_EXCHANGE:-rag_harness.jobs}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-rag_harness.jobs.retry}
      RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE:-rag_harness.jobs.dlx}
      RABBITMQ_JOB_QUEUE: ${RABBITMQ_JOB_QUEUE:-rag_harness.jobs}
      RABBITMQ_RETRY_QUEUE: ${RABBITMQ_RETRY_QUEUE:-rag_harness.jobs.retry}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-rag_harness.jobs.dlq}
      RABBITMQ_JOB_ROUTING_KEY: ${RABBITMQ_JOB_ROUTING_KEY:-job.execute}
      RABBITMQ_RETRY_ROUTING_KEY: ${RABBITMQ_RETRY_ROUTING_KEY:-job.retry}
      RABBITMQ_DEAD_LETTER_ROUTING_KEY: ${RABBITMQ_DEAD_LETTER_ROUTING_KEY:-job.dead}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-0.5}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-1}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-60}
      WORKER_PROCESSING_LEASE_SECONDS: ${WORKER_PROCESSING_LEASE_SECONDS:-900}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-5}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
      WORKER_RECOVERY_BATCH_SIZE: ${WORKER_RECOVERY_BATCH_SIZE:-20}
      WORKER_RECOVERY_POLL_SECONDS: ${WORKER_RECOVERY_POLL_SECONDS:-2}
      DLQ_PUBLISH_RETRY_BASE_SECONDS: ${DLQ_PUBLISH_RETRY_BASE_SECONDS:-5}
      DLQ_PUBLISH_RETRY_MAX_SECONDS: ${DLQ_PUBLISH_RETRY_MAX_SECONDS:-300}
      ENABLE_ADMIN_RECOVERY: ${ENABLE_ADMIN_RECOVERY:-false}
      ENABLE_ADMIN_OBSERVABILITY: ${ENABLE_ADMIN_OBSERVABILITY:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: ${METRICS_PORT:-9100}
      LOG_DIRECTORY: ${LOG_DIRECTORY:-/var/log/slack-rag}
      SERVICE_NAME: api
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      OLLAMA_GENERATION_TIMEOUT_SECONDS: ${OLLAMA_GENERATION_TIMEOUT_SECONDS:-120}
      WORKFLOW_QUESTION_MAX_CHARS: ${WORKFLOW_QUESTION_MAX_CHARS:-4000}
      WORKFLOW_MAX_QUERY_REWRITES: ${WORKFLOW_MAX_QUERY_REWRITES:-1}
      WORKFLOW_MAX_GENERATION_ATTEMPTS: ${WORKFLOW_MAX_GENERATION_ATTEMPTS:-2}
      WORKFLOW_DOCUMENT_GRADER: ${WORKFLOW_DOCUMENT_GRADER:-ollama}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://ai-gateway.vercel.sh}
      JEV_MODEL: ${JEV_MODEL:-typesafe-ai/jev}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-15}
      JEV_RELEVANCE_THRESHOLD: ${JEV_RELEVANCE_THRESHOLD:-0.7}
      JEV_CONFLICT_THRESHOLD: ${JEV_CONFLICT_THRESHOLD:-0.7}
      JEV_FALLBACK_TO_OLLAMA: ${JEV_FALLBACK_TO_OLLAMA:-true}
      JEV_FREE_USE_NOT_AFTER: ${JEV_FREE_USE_NOT_AFTER:-2026-09-25}
      LANGGRAPH_STRICT_MSGPACK: "true"
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      DOCUMENT_CHUNK_MAX_CHARS: ${DOCUMENT_CHUNK_MAX_CHARS:-1200}
      DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-120}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:--1.0}
      RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT: ${RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:-2}
      ENABLE_LOCAL_EVENTS: ${ENABLE_LOCAL_EVENTS:-true}
      SLACK_REPLY_ENABLED: ${SLACK_REPLY_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-local_test_signing_secret}
      SLACK_API_BASE_URL: ${SLACK_API_BASE_URL:-https://slack.com/api}
      SLACK_API_TIMEOUT_SECONDS: ${SLACK_API_TIMEOUT_SECONDS:-10}
      SLACK_REPLY_LEASE_SECONDS: ${SLACK_REPLY_LEASE_SECONDS:-30}
      SLACK_REPLY_MAX_ATTEMPTS: ${SLACK_REPLY_MAX_ATTEMPTS:-5}
      SLACK_REPLY_RETRY_BASE_SECONDS: ${SLACK_REPLY_RETRY_BASE_SECONDS:-2}
      SLACK_REPLY_RETRY_MAX_SECONDS: ${SLACK_REPLY_RETRY_MAX_SECONDS:-300}
      SLACK_TIMESTAMP_TOLERANCE_SECONDS: ${SLACK_TIMESTAMP_TOLERANCE_SECONDS:-300}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app-logs:/var/log/slack-rag
      - ./evaluation/results:/workspace/evaluation/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
    environment:
      <<: *app-environment
      METRICS_PORT: 9102
      SERVICE_NAME: outbox-publisher
    command: ["sh", "-c", "alembic upgrade head && python -m app.outbox.main"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - app-logs:/var/log/slack-rag
    restart: unless-stopped

  worker:
    build:
      context: .
    environment:
      <<: *app-environment
      METRICS_PORT: 9101
      SERVICE_NAME: worker
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker.main"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - app-logs:/var/log/slack-rag
    restart: unless-stopped

  test:
    build:
      context: .
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_harness}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${TEST_POSTGRES_DB:-rag_harness_test}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_harness}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${TEST_POSTGRES_DB:-rag_harness_test}
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_harness}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-rag_harness}
      TEST_DATABASE_NAME: ${TEST_POSTGRES_DB:-rag_harness_test}
      TEST_RABBITMQ_URL: amqp://${RABBITMQ_USER:-rag_harness}:${RABBITMQ_PASSWORD:-local_dev_password}@rabbitmq:5672/
      LOG_DIRECTORY: ""
      SERVICE_NAME: test
    command: ["sh", "-c", "python -m app.testing.prepare_database && alembic upgrade head && pytest -q"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles: ["test"]

  k6:
    image: grafana/k6:1.8.1
    environment:
      BASE_URL: ${LOADTEST_BASE_URL:-http://api:8000}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-local_test_signing_secret}
      REQUESTS: ${LOADTEST_REQUESTS:-20}
      VUS: ${LOADTEST_VUS:-10}
      RUN_ID: ${LOADTEST_RUN_ID:-}
      MODE: ${LOADTEST_MODE:-duplicate}
      SUMMARY_PATH: ${LOADTEST_SUMMARY_PATH:-/results/slack-webhook-summary.json}
      K6_NO_USAGE_REPORT: "true"
    command: ["run", "/scripts/slack-webhook.js"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./load-tests/k6:/scripts:ro
      - ./load-tests/results:/results
    profiles: ["loadtest"]
    restart: "no"

  load-observer:
    build:
      context: .
    environment:
      LOADTEST_QUEUE_MANAGEMENT_URL: http://rabbitmq:15672
      LOADTEST_QUEUE_NAME: ${RABBITMQ_JOB_QUEUE:-rag_harness.jobs}
      LOADTEST_QUEUE_USERNAME: ${RABBITMQ_USER:-rag_harness}
      LOADTEST_QUEUE_PASSWORD: ${RABBITMQ_PASSWORD:-local_dev_password}
      LOADTEST_QUEUE_INTERVAL_SECONDS: ${LOADTEST_QUEUE_INTERVAL_SECONDS:-1}
      LOADTEST_QUEUE_MAX_SAMPLES: ${LOADTEST_QUEUE_MAX_SAMPLES:-900}
      LOADTEST_QUEUE_STOP_WHEN_DRAINED: ${LOADTEST_QUEUE_STOP_WHEN_DRAINED:-true}
      LOADTEST_QUEUE_OUTPUT_PATH: ${LOADTEST_QUEUE_OUTPUT_PATH:-/results/queue-timeline.jsonl}
    command: ["python", "-m", "app.loadtest.observer"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./load-tests/results:/results
    profiles: ["loadtest"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
      outbox-publisher:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/var/log/slack-rag:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.6
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  alloy-data:
  app-logs:
  grafana-data:
  loki-data:
  postgres-data:
  prometheus-data:
