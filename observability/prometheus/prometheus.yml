global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: slack-rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: slack-rag-worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: slack-rag-outbox
    static_configs:
      - targets: ["outbox-publisher:9102"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
