[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-rag-harness"
version = "0.1.0"
description = "Local-first asynchronous RAG harness"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aio-pika==9.5.7",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: PostgreSQL 또는 RabbitMQ 컨테이너가 필요한 테스트",
]
